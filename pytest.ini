[pytest]
testpaths = tests e2e_tests
addopts = -v --disable-socket
filterwarnings =
    ignore:CUDA path could not be detected:UserWarning
    ignore:A test tried to use socket.socket:UserWarning
markers =
    tier1: Tier 1 Feature Coverage tests (Features 1-31)
    tier2: Tier 2 Boundary & Corner Case tests
    tier3: Tier 3 Cross-Feature Interaction tests
    tier4: Tier 4 Real-World Application Scenario tests
    gpu: Tests requiring NVIDIA CUDA acceleration
    slow: Long-running benchmark or high-res tests
